name: Windows build

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/windows-build.yml"
      - "compat/**"
      - "scripts/build_windows.ps1"
      - "src_CUDA/**"
      - "src_HashExtractor/**"
      - "src_RPGenerator/**"

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install CUDA toolkit
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP "cuda_12.6.3_windows.exe"
          curl.exe -L --retry 5 --retry-delay 10 --output $installer https://developer.download.nvidia.com/compute/cuda/12.6.3/local_installers/cuda_12.6.3_windows.exe
          if ($LASTEXITCODE -ne 0) { throw "CUDA installer download failed with exit code $LASTEXITCODE" }
          $process = Start-Process -FilePath $installer -ArgumentList @("-s", "-n", "nvcc_12.6", "cudart_12.6", "visual_studio_integration_12.6") -NoNewWindow -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "CUDA installer failed with exit code $($process.ExitCode)" }
          $cudaPath = "C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v12.6"
          "$cudaPath\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
          "CUDA_PATH=$cudaPath" | Out-File -FilePath $env:GITHUB_ENV -Append
          & "$cudaPath\bin\nvcc.exe" --version

      - name: Build Windows executables
        shell: pwsh
        run: ./scripts/build_windows.ps1

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bitcracker-windows-sm89
          path: build/*.exe

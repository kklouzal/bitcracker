name: Windows build

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/windows-build.yml"
      - "compat/**"
      - "scripts/build_windows.ps1"
      - "src_CUDA/**"
      - "src_HashExtractor/**"
      - "src_RPGenerator/**"

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install CUDA toolkit
        shell: pwsh
        run: |
          choco install cuda --version=12.6.3.561 -y --no-progress
          $cudaPath = "C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v12.6"
          "$cudaPath\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
          "CUDA_PATH=$cudaPath" | Out-File -FilePath $env:GITHUB_ENV -Append
          & "$cudaPath\bin\nvcc.exe" --version

      - name: Build Windows executables
        shell: pwsh
        run: ./scripts/build_windows.ps1

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bitcracker-windows-sm89
          path: build/*.exe
